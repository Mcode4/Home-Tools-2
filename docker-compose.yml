services:
  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: appdb
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    networks:
      - app-network
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    container_name: fastapi_backend
    restart: always
    depends_on:
      - db
    environment:
      - PROJECT_ENV=production
      - POSTGRES_URL=${POSTGRES_URL:?POSTGRES_URL must be set in .env}
      - SECRET_KEY=${SECRET_KEY:?SECRET_KEY must be set in .env}
      - ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-8000}
    ports:
      - "${BACKEND:-8888}:${BACKEND_INTERNAL_PORT:-8000}"
    networks:
      - app-network

  frontend:
    build: ./frontend
    container_name: react_frontend
    restart: always
    environment:
      - BACKEND_INTERNAL_PORT=${BACKEND_INTERNAL_PORT:-8000}
    ports:
      - "${FRONTEND:-3000}:80"
    depends_on:
      - backend
    networks:
      - app-network

  adminer:
    image: adminer
    restart: always
    ports:
      - "${ADMINER:-8081}:8080"
    networks:
      - app-network

  umami-db:
    image: postgres:15
    container_name: umami_db
    restart: always
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami_db_data:/var/lib/postgresql/data
    networks:
      - app-network

  umami:
    image: ghcr.io/umami-software/umami:postgresql-latest
    container_name: umami_app
    restart: always
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@umami-db:5432/umami
      DATABASE_TYPE: postgres
      APP_SECRET: ${APP_SECRET:?APP_SECRET must be set in .env}
    depends_on:
      - umami-db
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  umami_db_data: